name: Render YouTube Short as MP4

on:
  workflow_dispatch:
    inputs:
      publish_to_youtube:
        description: "Publish to YouTube? (uses API quota — choose wisely)"
        required: true
        type: choice
        default: "no"
        options:
          - "yes — publish now"
          - "no — render only"
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use standalone package.json
        run: cp package.standalone.json package.json

      - name: Install ffmpeg (early — ready before recording)
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: Start preview server
        run: npm run preview &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:4173/ && break
            sleep 1
          done

      - name: Record video
        run: node scripts/record-video.mjs

      - name: Convert WebM to MP4 (optimized for size)
        run: |
          ffmpeg -i output/youtube-short.webm \
            -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -threads 0 \
            output/youtube-short.mp4
          echo "MP4 size: $(du -sh output/youtube-short.mp4 | cut -f1)"
          echo "WebM size: $(du -sh output/youtube-short.webm | cut -f1)"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-mp4
          path: output/youtube-short.mp4
          retention-days: 30

      - name: Upload WebM artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-webm
          path: output/youtube-short.webm
          retention-days: 7

      - name: Publish to YouTube Shorts
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.publish_to_youtube, 'yes') }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: "Al Nasme — The Art of Travel | النسمة للحقائب الفاخرة"
          VIDEO_DESCRIPTION: |
            ✈️ Discover Al Nasme's premium luggage collection — crafted for those who travel in style.

            🧳 Timeless designs. Unmatched quality. Built for every journey.

            🛒 Shop now: [your link here]

            #AlNasme #LuggageCollection #TravelInStyle #النسمة #حقائب_سفر #حقائب_فاخرة #Shorts
        run: node scripts/upload-youtube.mjs
